<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas do mês — controle financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB; --panel:#FFFFFF; --ink:#2B3550; --ink2:#5B6682; --line:#E3E8F2; --focus:#5B8FC9;
  --mint-bg:#D5F0E3; --mint-ink:#1F6B4E; --mint:#8FD3B1;
  --peach-bg:#FFE0D1; --peach-ink:#9A4A24; --peach:#F5B796;
  --lav-bg:#E1DCF7; --lav-ink:#54449C; --lav:#B4A9EA;
  --sky-bg:#D6E8F8; --sky-ink:#255F8E; --sky:#8DBEE8;
  --butter-bg:#FFF2C4; --butter-ink:#7A5E00; --butter:#F2D87A;
  --rose-bg:#FADADF; --rose-ink:#9B3450; --rose:#EF9FB1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C2233; --panel:#252C42; --ink:#E8ECF7; --ink2:#A6B0CC; --line:#353E5C; --focus:#8DBEE8;
    --mint-bg:#27493E; --mint-ink:#A9E3C8; --mint:#5FAE88;
    --peach-bg:#54362B; --peach-ink:#FFC9AE; --peach:#D98F6C;
    --lav-bg:#3B3560; --lav-ink:#CBC3F5; --lav:#8A7DD0;
    --sky-bg:#26425E; --sky-ink:#B5D8F5; --sky:#5E94C4;
    --butter-bg:#504520; --butter-ink:#F6E3A0; --butter:#C9AE4E;
    --rose-bg:#57303C; --rose-ink:#F5B8C6; --rose:#C9708A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C2233; --panel:#252C42; --ink:#E8ECF7; --ink2:#A6B0CC; --line:#353E5C; --focus:#8DBEE8;
  --mint-bg:#27493E; --mint-ink:#A9E3C8; --mint:#5FAE88;
  --peach-bg:#54362B; --peach-ink:#FFC9AE; --peach:#D98F6C;
  --lav-bg:#3B3560; --lav-ink:#CBC3F5; --lav:#8A7DD0;
  --sky-bg:#26425E; --sky-ink:#B5D8F5; --sky:#5E94C4;
  --butter-bg:#504520; --butter-ink:#F6E3A0; --butter:#C9AE4E;
  --rose-bg:#57303C; --rose-ink:#F5B8C6; --rose:#C9708A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 56px}

/* topo */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{display:flex;gap:12px;align-items:center}
.brand .logo{width:44px;height:44px;border-radius:14px;background:var(--lav-bg);color:var(--lav-ink);display:grid;place-items:center}
.brand h1{font-size:22px}
.brand p{color:var(--ink2);font-size:13px}
.monthnav{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.monthnav button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;font-size:20px;line-height:1;color:var(--ink2)}
.monthnav button:hover{background:var(--sky-bg);color:var(--sky-ink)}
.monthnav select{border:0;background:transparent;font-weight:700;font-family:Fraunces,Georgia,serif;font-size:17px;padding:4px 6px;min-width:112px;text-align:center;text-align-last:center}
.save{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block}
.save.warn i{background:var(--butter)}

/* abas */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);padding:9px 14px;border-radius:14px;font-weight:600;font-size:14px}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{background:var(--lav-bg);color:var(--lav-ink);border-color:transparent}

/* blocos */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
.ph{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.bubble{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.bubble svg{width:20px;height:20px}
.ph h2{font-size:19px}
.ph .sum{color:var(--ink2);font-size:13.5px;margin-top:2px;max-width:70ch}
.t-mint{background:var(--mint-bg);color:var(--mint-ink)} .t-peach{background:var(--peach-bg);color:var(--peach-ink)}
.t-lav{background:var(--lav-bg);color:var(--lav-ink)} .t-sky{background:var(--sky-bg);color:var(--sky-ink)}
.t-butter{background:var(--butter-bg);color:var(--butter-ink)} .t-rose{background:var(--rose-bg);color:var(--rose-ink)}

.hero{border-radius:22px;padding:22px 24px;display:flex;gap:16px;align-items:flex-start;margin-top:2px}
.hero .bubble{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.55);color:inherit}
:root[data-theme="dark"] .hero .bubble{background:rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .bubble{background:rgba(255,255,255,.12)}}
.hero .bubble svg{width:26px;height:26px}
.hero h2{font-size:clamp(22px,3.4vw,30px)}
.hero p{margin-top:6px;font-size:15.5px;max-width:62ch}
.hero strong{font-weight:700}

/* caminho do dinheiro */
.flow{display:grid;gap:14px}
.fr{display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:center}
.fr .lab{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.fr .lab small{display:block;font-weight:400;color:var(--ink2);font-size:12px;line-height:1.3}
.fr .lab .bubble{width:34px;height:34px;border-radius:11px}
.fr .lab .bubble svg{width:18px;height:18px}
.track{position:relative;height:40px;border-radius:12px;background:repeating-linear-gradient(135deg,transparent 0 7px,var(--line) 7px 8px);display:flex;overflow:hidden}
.seg{height:100%;display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden}
@media (prefers-reduced-motion:no-preference){.seg{transition:width .5s ease}}
.s-mint{background:var(--mint);color:#16402F}.s-sky{background:var(--sky);color:#12385A}.s-lav{background:var(--lav);color:#2E2466}
.s-peach{background:var(--peach);color:#5A2A10}.s-rose{background:var(--rose);color:#58182B}.s-butter{background:var(--butter);color:#4B3A00}
:root[data-theme="dark"] .seg{color:#10141F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg{color:#10141F}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* pequenas informações */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.fact{border-radius:16px;padding:14px 16px}
.fact .k{font-size:12.5px;display:flex;gap:6px;align-items:center;font-weight:600}
.fact .k svg{width:16px;height:16px}
.fact .v{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:23px;margin-top:2px}
.fact .n{font-size:12.5px;opacity:.85;margin-top:2px}
.gauge{position:relative;height:12px;border-radius:99px;margin-top:10px;background:linear-gradient(90deg,var(--mint) 0 var(--g1),var(--butter) var(--g1) var(--g2),var(--rose) var(--g2) 100%)}
.gauge b{position:absolute;top:-5px;width:4px;height:22px;border-radius:3px;background:var(--ink);left:var(--pos);transform:translateX(-2px)}

/* checklist */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.steps .bubble{width:32px;height:32px;border-radius:10px}
.steps .bubble svg{width:17px;height:17px}
.steps .tx{flex:1;font-size:14.5px}
.steps .tx small{display:block;color:var(--ink2);font-size:12.5px}

/* gráficos */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:Figtree,system-ui,sans-serif;fill:var(--ink2);font-size:11px}
.chart .hit{cursor:pointer}
.cat{display:grid;grid-template-columns:130px 1fr 96px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.cat .name{display:flex;gap:8px;align-items:center;font-weight:600}
.cat .dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.cat .val{text-align:right;font-weight:700}
.cat .track{height:22px;border-radius:8px}

/* listas */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.row.done{background:var(--mint-bg);border-color:transparent}
.row .ttl{font-weight:600}
.row .sub{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px}
.row .amt{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:17px;text-align:right}
.acts{display:flex;gap:4px}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);display:grid;place-items:center}
.ib svg{width:17px;height:17px}
.ib:hover{background:var(--sky-bg);color:var(--sky-ink)}
.ib.del:hover{background:var(--rose-bg);color:var(--rose-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.chip svg{width:13px;height:13px}
.check{appearance:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;margin:0;cursor:pointer}
.check:checked{background:var(--mint);border-color:var(--mint)}
.check:checked::after{content:"";width:6px;height:11px;border:solid #16402F;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.prog{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px;min-width:110px}
.prog b{display:block;height:100%;border-radius:99px;background:var(--lav)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:9px 14px;font-weight:600;font-size:14px}
.btn svg{width:17px;height:17px}
.btn:hover{background:var(--sky-bg);color:var(--sky-ink);border-color:transparent}
.btn.primary{background:var(--lav);border-color:transparent;color:#2E2466}
.btn.primary:hover{background:var(--lav);filter:brightness(.96)}
:root[data-theme="dark"] .btn.primary{color:#10141F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#10141F}}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--ink2)}
.pill[aria-pressed="true"]{background:var(--sky-bg);color:var(--sky-ink);border-color:transparent}
.empty{text-align:center;padding:26px 12px;color:var(--ink2);border:2px dashed var(--line);border-radius:16px}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}

/* pessoas */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel)}
.pcard header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}
.pcard h3{font-size:18px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.nums div{border-radius:12px;padding:8px 10px}
.nums small{display:block;font-size:11.5px;font-weight:600}
.nums b{font-family:Fraunces,Georgia,serif;font-size:16px}
.pcard ul{list-style:none;margin:8px 0;padding:0;font-size:13px;color:var(--ink2)}
.pcard li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}

/* tabelas */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
thead th{font-weight:700;color:var(--ink2);border-bottom:1px solid var(--line)}
tbody tr+tr td{border-top:1px solid var(--line)}
th.sel,td.sel{box-shadow:inset 0 0 0 2px var(--lav)}
.gantt{display:grid;grid-template-columns:200px repeat(12,minmax(44px,1fr));gap:3px;min-width:760px;align-items:center;font-size:12px}
.gantt .gh{text-align:center;font-weight:700;color:var(--ink2);padding:4px 0;border-radius:8px}
.gantt .gh.sel{background:var(--lav-bg);color:var(--lav-ink)}
.gantt .gl{font-weight:600;font-size:13px;padding-right:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt .gl small{color:var(--ink2);font-weight:400}
.gantt .gc{height:26px;border-radius:7px;text-align:center;line-height:26px;font-weight:700;font-size:11px;color:#1d2540;background:transparent}
.gantt .gc.on{background:var(--c)}
.gantt .gc.rec{background:repeating-linear-gradient(135deg,var(--c) 0 6px,transparent 6px 9px)}
.gantt .gc.selc{outline:2px solid var(--lav-ink);outline-offset:-2px}

/* formulários */
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-weight:600;font-size:13.5px}
.field small{color:var(--ink2);font-size:12.5px}
.field input,.field select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);width:100%}
.field input:focus,.field select:focus{border-color:var(--focus);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#modal{position:fixed;inset:0;background:rgba(36,44,70,.38);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
#modal[hidden]{display:none}
.sheet{background:var(--panel);border-radius:20px;padding:22px;width:min(480px,100%);max-height:92vh;overflow:auto;border:1px solid var(--line)}
.sheet h3{font-size:20px;margin-bottom:14px}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn.ghost{background:transparent}
.err{color:var(--rose-ink);background:var(--rose-bg);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.err:empty{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:60}
#toast[hidden]{display:none}
details.gl{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:8px;background:var(--bg)}
details.gl summary{cursor:pointer;font-weight:600}
details.gl p{margin-top:6px;color:var(--ink2);font-size:14px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mini{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.mini .grow{flex:1}
.mini input[type=text]{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);width:100%}
.note{font-size:12.5px;color:var(--ink2)}
@media (max-width:640px){
  .fr{grid-template-columns:1fr}
  .cat{grid-template-columns:1fr 84px;}
  .cat .track{grid-column:1 / -1;order:3}
  .row{grid-template-columns:auto 1fr auto}
  .row .acts{grid-column:1 / -1;justify-content:flex-end}
  .two{grid-template-columns:1fr}
  .hero{padding:18px}
  .nums{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>

    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>

const pm = ym => { const [y, m] = ym.split('-').map(Number); return {y, m}; };
const ymAdd = (ym, k) => { const {y, m} = pm(ym); const t = y * 12 + (m - 1) + k; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`; };
const ymDiff = (a, b) => { const A = pm(a), B = pm(b); return (A.y - B.y) * 12 + A.m - B.m; };
const mLabel = ym => { const {y, m} = pm(ym); return `${MN[m - 1]}/${String(y).slice(2)}`; };
const mLong = ym => { const {y, m} = pm(ym); return `${MF[m - 1]} de ${y}`; };

/* ============================ estado e armazenamento ============================ */

function normalize(o){
  const d = seed();
  if (!o || typeof o !== 'object') return d;
  for (const k of ['incomes','bills','purchases','received','people','cats']) if (!Array.isArray(o[k])) o[k] = d[k];
  o.count = Number.isInteger(o.count) && o.count > 0 ? o.count : 12; if (!Array.isArray(o.hidden)) o.hidden = []; o.titular = o.titular || d.titular; o.start = o.start || d.start;
  o.yellow = typeof o.yellow === 'number' ? o.yellow : d.yellow; o.red = typeof o.red === 'number' ? o.red : d.red;
  return o;
}
function loadLocal(){ try { const t = localStorage.getItem(LS); return t ? normalize(JSON.parse(t)) : null; } catch (e) { return null; } }

async function flush(){

const monthsList = () => { const l = Array.from({length: S.count || 12}, (_, i) => ymAdd(S.start, i)).filter(m => !(S.hidden || []).includes(m)); return l.length ? l : [S.start]; };
function monthQuitado(m){ const s = stats(m); return s.bills.every(b => b.paid) && Object.values(s.aberto).every(v => v <= 0.005); }
const planOn = (p, m) => { const d = ymDiff(m, p.start); return d >= 0 && (p.n == null || d < p.n); };
const planAmt = (p, m) => planOn(p, m) ? p.valor : 0;
const planIdx = (p, m) => ymDiff(m, p.start) + 1;
const planEnd = p => p.n == null ? null : ymAdd(p.start, p.n - 1);
const personInBill = n => { const p = S.people.find(x => x.name === n); return p ? p.inBill : true; };
const isTit = n => n === S.titular;
const peopleAll = () => [S.titular, ...S.people.map(p => p.name)];
const PCOL = ['lav','peach','butter','mint','rose','sky'];
const pcol = n => isTit(n) ? 'sky' : PCOL[Math.max(0, S.people.findIndex(p => p.name === n)) % PCOL.length];
const CCOL = ['mint','peach','lav','sky','butter','rose'];
const ccol = c => CCOL[Math.max(0, S.cats.indexOf(c)) % CCOL.length];

function stats(m){
  const receitas = sum(S.incomes, p => planAmt(p, m));
  const bills = S.bills.filter(b => b.month === m);
  const faturas = sum(bills, b => b.valor);
  const pago = sum(bills.filter(b => b.paid), b => b.valor);
  const dev = {}, rec = {};
  S.people.forEach(p => { dev[p.name] = 0; rec[p.name] = 0; });
  let titular = 0;
  S.purchases.forEach(p => {
    const a = planAmt(p, m); if (!a) return;
    if (isTit(p.who)) titular += a; else dev[p.who] = (dev[p.who] || 0) + a;
  });
  S.received.filter(r => r.month === m).forEach(r => { rec[r.who] = (rec[r.who] || 0) + r.valor; });
  let emb = 0, fora = 0;
  Object.keys(dev).forEach(n => { if (personInBill(n)) emb += dev[n]; else fora += dev[n]; });
  const liquido = faturas - emb;
  const resultado = receitas - liquido;
  const aberto = {};
  Object.keys(dev).forEach(n => aberto[n] = r2(dev[n] - (rec[n] || 0)));
  return {receitas, bills, faturas, pago, aPagar: faturas - pago, dev, rec, aberto, titular, emb, fora, liquido, resultado,
          pct: receitas > 0 ? liquido / receitas : null, inconsist: faturas + 0.005 < emb};
}
function openUntil(name, m){
  return r2(sum(monthsList().filter(x => ymDiff(x, m) <= 0), x => { const s = stats(x); return s.aberto[name] || 0; }));
}
function futureParcels(m, who){
  return sum(S.purchases.filter(p => p.n != null && (!who || p.who === who)), p => {
    const idx = planIdx(p, m); return Math.max(0, p.n - Math.max(0, idx)) * p.valor; });
}

function barChart(){
  const ml = monthsList(), st = ml.map(stats);
  const mx = Math.max(1, ...st.map(x => Math.max(x.receitas, Math.max(0, x.liquido))));
  const W = 720, H = 230, pad = 10, base = H - 28, ch = base - 22, gw = (W - pad * 2) / ml.length, bw = 17;
  let g = '';
  ml.forEach((m, i) => {
    const x = pad + i * gw, a = st[i].receitas / mx * ch, b = Math.max(0, st[i].liquido) / mx * ch, sel = m === cur;
    g += `<g class="hit" data-month="${m}" tabindex="0" role="button" aria-label="${esc(mLabel(m))}: receitas ${money(st[i].receitas)}, sua parte ${money(st[i].liquido)}">
      ${sel ? `<rect x="${x + 2}" y="6" width="${gw - 4}" height="${H - 12}" rx="10" fill="var(--lav-bg)"/>` : ''}
      <rect x="${x + gw / 2 - bw - 1}" y="${base - a}" width="${bw}" height="${Math.max(a, 0)}" rx="5" fill="var(--mint)"/>
      <rect x="${x + gw / 2 + 1}" y="${base - b}" width="${bw}" height="${Math.max(b, 0)}" rx="5" fill="var(--sky)"/>
      <text x="${x + gw / 2}" y="${H - 8}" text-anchor="middle" ${sel ? 'style="font-weight:700;fill:var(--lav-ink)"' : ''}>${mLabel(m)}</text>
      ${sel ? `<text x="${x + gw / 2}" y="20" text-anchor="middle" style="font-weight:700;fill:var(--ink)">${money(st[i].resultado)}</text>` : ''}
    </g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="Receitas e sua parte nas faturas, por mês">${g}</svg>`;
}
function catBars(){
  const m = cur, byC = {};
  S.purchases.forEach(p => { const a = planAmt(p, m); if (!a) return; const c = p.cat || 'Outros'; byC[c] = byC[c] || {t: 0, me: 0}; byC[c].t += a; if (isTit(p.who)) byC[c].me += a; });
  const rows = Object.entries(byC).sort((a, b) => b[1].t - a[1].t);
  if (!rows.length) return emptyBox('Nenhuma compra neste mês', 'Cadastre compras e assinaturas na aba “Compras e parcelas”.');
  const mx = rows[0][1].t;
  return rows.map(([c, v]) => `<div class="cat"><div class="name"><span class="dot" style="background:var(--${ccol(c)})"></span>${esc(c)}</div>
    <div class="track"><div class="seg s-sky" style="width:${v.me / mx * 100}%"></div><div class="seg s-lav" style="width:${(v.t - v.me) / mx * 100}%"></div></div><div class="val">${money(v.t)}</div></div>`).join('')
    + `<div class="legend"><span><i style="background:var(--sky)"></i>Sua parte</span><span><i style="background:var(--lav)"></i>Terceiros</span></div>`;
}
function pieChart(){
  const by = {};
  S.purchases.forEach(p => { const a = planAmt(p, cur); if (!a) return; by[p.who] = (by[p.who] || 0) + a; });
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const total = sum(rows, r => r[1]);
  if (!rows.length) return emptyBox('Nenhuma compra neste mês', 'Cadastre compras e assinaturas na aba “Compras e parcelas”.');
  const pct = v => (v / total * 100).toFixed(1).replace('.', ',') + '%';
  const cx = 115, cy = 110, R = 92, r = 54, pt = (rad, ang) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)];
  let segs = '', angle = -Math.PI / 2;
  if (rows.length === 1) {
    segs = `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="var(--${pcol(rows[0][0])})" stroke-width="${R - r}"/>`;
  } else rows.forEach(([n, v]) => {
    const a2 = angle + (v / total) * 2 * Math.PI, large = (v / total) > 0.5 ? 1 : 0;
    const [x1, y1] = pt(R, angle), [x2, y2] = pt(R, a2 - 0.0001), [x3, y3] = pt(r, a2 - 0.0001), [x4, y4] = pt(r, angle);
    segs += `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${x3.toFixed(2)} ${y3.toFixed(2)} A ${r} ${r} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z" fill="var(--${pcol(n)})"><title>${esc(n)}: ${money(v)} (${pct(v)})</title></path>`;
    if (v / total >= 0.07) {
      const [tx, ty] = pt((R + r) / 2, (angle + a2) / 2);
      segs += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="central" style="fill:#1d2540;font-weight:700;font-size:12px">${pct(v)}</text>`;
    }
    angle = a2;
  });
  const legend = `<div class="legend" style="margin-top:10px">${rows.map(([n, v]) => `<span><i style="background:var(--${pcol(n)})"></i>${esc(n)} — ${money(v)} (${pct(v)})</span>`).join('')}</div>`;
  return `<div style="display:grid;gap:14px;align-items:center;grid-template-columns:minmax(230px,300px) 1fr">
    <svg class="chart" viewBox="0 0 230 220" role="img" aria-label="Gasto percentual de cada pessoa em ${esc(mLabel(cur))}">${segs}
      <text x="${cx}" y="${cy - 8}" text-anchor="middle" style="fill:var(--ink2);font-size:11px">Total do mês</text>
      <text x="${cx}" y="${cy + 12}" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:14px;font-family:Fraunces,Georgia,serif">${money(total)}</text></svg>
    <div>${legend}</div></div>
  <p class="note" style="margin-top:10px">Soma das compras e assinaturas ativas de cada pessoa em ${esc(mLabel(cur))}. Muda sozinho ao trocar o mês ou ajustar itens.</p>`;
}

        <div class="two"><div class="field"><label for="s-y">Alerta amarelo (%)</label><input id="s-y" inputmode="numeric" value="${Math.round(S.yellow * 100)}" data-set="yellow"></div>
        <div class="field"><label for="s-r">Alerta vermelho (%)</label><input id="s-r" inputmode="numeric" value="${Math.round(S.red * 100)}" data-set="red"></div></div>
        <p class="note">Os alertas avisam quando a sua parte passa dessa fatia da renda.</p></div>
      <div><h3 style="font-size:16px;margin-bottom:6px">Pessoas</h3>
        ${S.people.map((p, i) => `<div class="mini"><div class="grow"><input type="text" value="${esc(p.name)}" data-pname="${i}" aria-label="Nome da pessoa"></div>
          <label class="note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-pbill="${i}" ${p.inBill ? 'checked' : ''}>Na minha fatura</label>
          <button class="ib" data-act="up-person" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Subir ${esc(p.name)}">▲</button>
          <button class="ib" data-act="down-person" data-i="${i}" ${i === S.people.length - 1 ? 'disabled' : ''} aria-label="Descer ${esc(p.name)}">▼</button>
          <button class="ib del" data-act="del-person" data-i="${i}" aria-label="Remover ${esc(p.name)}">${ico('trash')}</button></div>`).join('')}
        <button class="btn" style="margin-top:10px" data-act="add-person">${ico('plus')}Adicionar pessoa</button></div>
      <div><h3 style="font-size:16px;margin-bottom:6px">Categorias</h3>
        ${S.cats.map((c, i) => `<div class="mini"><span class="dot" style="width:10px;height:10px;border-radius:3px;background:var(--${ccol(c)})"></span><div class="grow"><input type="text" value="${esc(c)}" data-cname="${i}" aria-label="Nome da categoria"></div></div>`).join('')}
        <button class="btn" style="margin-top:10px" data-act="add-cat">${ico('plus')}Adicionar categoria</button></div>
    </div>
  </section>
  <section class="panel">
    ${head('sky','down','Seus dados','Exporte, guarde uma cópia ou recomece.')}
    <div class="pills">
      ${dl ? `<button class="btn" data-act="exp-csv">${ico('down')}Exportar resumo (CSV)</button><button class="btn" data-act="exp-json">${ico('down')}Cópia de segurança (JSON)</button>` : '<span class="note">A exportação de arquivos não está disponível nesta tela.</span>'}
      <label class="btn" for="imp" style="cursor:pointer">${ico('in')}Restaurar cópia</label><input id="imp" type="file" accept=".json,application/json" hidden>
      <button class="btn" data-act="reset">${ico('copy')}Voltar aos dados iniciais</button>
    </div>
    <p class="note" style="margin-top:12px">${dbDoc ? 'Seus dados ficam salvos na sua conta, só visíveis para você.' : 'Seus dados ficam salvos só neste navegador. Em outros aparelhos, eles não aparecem.'}</p>
  </section>`;
}

/* ============================ formulários ============================ */
function fieldHtml(f){
  const id = 'f-' + f.name, v = f.value ?? '';
  let c;
  if (f.type === 'select') c = `<select id="${id}" name="${f.name}">${f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
  else if (f.type === 'month') c = `<input id="${id}" name="${f.name}" type="month" value="${esc(v)}">`;
  else c = `<input id="${id}" name="${f.name}" type="text" ${f.type === 'money' || f.type === 'int' ? 'inputmode="decimal"' : ''} value="${esc(v)}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} autocomplete="off">`;
  return `<div class="field"><label for="${id}">${esc(f.label)}</label>${c}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</div>`;
}
function closeModal(){ const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
function openForm(cfg){
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(cfg.title)}</h3>
    <form id="mf" novalidate>${cfg.fields.map(fieldHtml).join('')}<div class="err" id="merr" role="alert"></div>
    <div class="btns"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" type="submit">${esc(cfg.cta || 'Salvar')}</button></div></form></div>`;
  m.hidden = false;
  const first = m.querySelector('input,select'); if (first) first.focus();
  $('#mf').onsubmit = e => {
    e.preventDefault();
    const v = {};
    cfg.fields.forEach(f => {
      const raw = $('#f-' + f.name).value;
      v[f.name] = f.type === 'money' ? parseNum(raw) : f.type === 'int' ? (raw.trim() === '' ? null : Number(raw)) : f.type === 'text' ? raw.trim() : raw;
    });
    const err = cfg.validate ? cfg.validate(v) : '';
    if (err) { $('#merr').textContent = err; return; }
    closeModal(); cfg.onSave(v); persist(); render();
  };
}
function confirmBox(text, onYes, cta='Excluir'){
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(text)}</h3><p class="note">Essa ação não pode ser desfeita.</p>
    <div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" id="yes">${esc(cta)}</button></div></div>`;
  m.hidden = false; $('#yes').focus();
  $('#yes').onclick = () => { closeModal(); onYes(); persist(); render(); };
}
let tt; function toast(t){ const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 2400); }

const personOpts = () => peopleAll().map(n => ({v: n, l: n}));
const catOpts = () => S.cats.map(c => ({v: c, l: c}));
const needVal = v => (isNaN(v.valor) || v.valor <= 0) ? 'Informe um valor maior que zero, por exemplo 1.234,56.' : '';
const needNum = v => (v.n != null && (!Number.isInteger(v.n) || v.n < 1 || v.n > 120)) ? 'Parcelas: informe um número inteiro de 1 a 120, ou deixe vazio para recorrente.' : '';

function formIncome(p){
  openForm({title: p ? 'Editar receita' : 'Nova receita', fields: [
    {name:'desc', label:'Descrição', type:'text', value:p?.desc, ph:'Ex.: Salário'},
    {name:'valor', label:'Valor por mês (R$)', type:'money', value:p ? numIn(p.valor) : '', ph:'2.600,00'},
    {name:'start', label:'Primeiro mês', type:'month', value:p?.start || cur},
    {name:'n', label:'Quantos meses', type:'int', value:p?.n ?? '', hint:'Deixe vazio se acontece todo mês, sem data final.'}],
    validate: v => !v.desc ? 'Escreva uma descrição.' : needVal(v) || (!v.start ? 'Escolha o primeiro mês.' : needNum(v)),
    onSave: v => { if (p) Object.assign(p, v); else S.incomes.push({id: uid(), ...v}); }});
}
function formBill(b){
  openForm({title: b ? 'Editar fatura' : 'Nova fatura', fields: [
    {name:'desc', label:'Nome da fatura ou conta', type:'text', value:b?.desc, ph:'Ex.: Cartão físico'},
    {name:'valor', label:'Valor total (R$)', type:'money', value:b ? numIn(b.valor) : '', ph:'1.247,18'},
    {name:'month', label:'Mês', type:'month', value:b?.month || cur}],
    validate: v => !v.desc ? 'Escreva o nome da fatura.' : needVal(v) || (!v.month ? 'Escolha o mês.' : ''),
    onSave: v => { if (b) Object.assign(b, v); else S.bills.push({id: uid(), paid: false, ...v}); }});
}
function formPurchase(p){
  openForm({title: p ? 'Editar item' : 'Novo item', fields: [
    {name:'desc', label:'Descrição', type:'text', value:p?.desc, ph:'Ex.: Tênis'},
    {name:'who', label:'Quem é o responsável', type:'select', value:p?.who || S.titular, options:personOpts()},
    {name:'cat', label:'Categoria', type:'select', value:p?.cat || S.cats[0], options:catOpts()},
    {name:'valor', label:'Valor da parcela (R$)', type:'money', value:p ? numIn(p.valor) : '', ph:'89,90'},
    {name:'start', label:'Mês da 1ª parcela', type:'month', value:p?.start || cur},
    {name:'n', label:'Número de parcelas', type:'int', value:p?.n ?? '', hint:'Deixe vazio para assinatura ou item recorrente. Compra à vista: 1.'},
    {name:'obs', label:'Observação (opcional)', type:'text', value:p?.obs}],
    validate: v => !v.desc ? 'Escreva uma descrição.' : needVal(v) || (!v.start ? 'Escolha o mês da 1ª parcela.' : needNum(v)),
    onSave: v => { if (p) Object.assign(p, v); else S.purchases.push({id: uid(), ...v}); }});
}
function formRecv(who){
  const s = stats(cur);
  openForm({title: `Registrar recebimento de ${who}`, fields: [
    {name:'valor', label:`Valor recebido em ${mLabel(cur)} (R$)`, type:'money', value:numIn(Math.max(0, s.aberto[who] || 0)), hint:`Em aberto neste mês: ${money(s.aberto[who] || 0)}.`}],
    validate: needVal, onSave: v => S.received.push({id: uid(), who, month: cur, valor: v.valor})});
}

/* ============================ exportação ============================ */
async function saveFile(name, data, ok){
  try { await dl.save({filename: name, data}); toast(ok); } catch (e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o arquivo.'); }
}
function csv(){
  const ml = monthsList(), q = v => '"' + String(v).replace(/"/g, '""') + '"', n = v => String(r2(v)).replace('.', ',');
  const L = [['Mês','Receitas','Faturas','Terceiros devolvem','Sua parte','Resultado'].map(q).join(';')];
  ml.forEach(m => { const s = stats(m); L.push([mLabel(m), n(s.receitas), n(s.faturas), n(s.emb), n(s.liquido), n(s.resultado)].map(q).join(';')); });
  L.push('', ['Item','Responsável','Categoria','Valor da parcela','1ª parcela','Parcelas'].map(q).join(';'));
  S.purchases.forEach(p => L.push([p.desc, p.who, p.cat, n(p.valor), mLabel(p.start), p.n ?? 'recorrente'].map(q).join(';')));
  return '\uFEFF' + L.join('\r\n');
}

/* ============================ eventos ============================ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-filt],[data-month]');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo({top: 0}); return; }
  if (t.dataset.filt) { filt = t.dataset.filt; render(); return; }
  if (t.dataset.month) { cur = t.dataset.month; render(); return; }
  const a = t.dataset.act, id = t.dataset.id, ml = monthsList();
  const find = (arr) => arr.find(x => x.id === id);
  switch (a) {
    case 'prev': { const i = ml.indexOf(cur); if (i > 0) { cur = ml[i - 1]; render(); } break; }
    case 'next': { const i = ml.indexOf(cur); if (i < ml.length - 1) { cur = ml[i + 1]; render(); } break; }
    case 'close': closeModal(); break;
    case 'add-income': formIncome(); break;
    case 'edit-income': formIncome(find(S.incomes)); break;
    case 'del-income': { const p = find(S.incomes); confirmBox(`Excluir “${p.desc}”?`, () => S.incomes = S.incomes.filter(x => x.id !== id)); break; }
    case 'add-bill': formBill(); break;
    case 'edit-bill': formBill(find(S.bills)); break;
    case 'del-bill': { const b = find(S.bills); confirmBox(`Excluir a fatura “${b.desc}”?`, () => S.bills = S.bills.filter(x => x.id !== id)); break; }
    case 'copy-bills': {
      const prev = ymAdd(cur, -1), have = new Set(S.bills.filter(b => b.month === cur).map(b => b.desc)); let c = 0;
      S.bills.filter(b => b.month === prev && !have.has(b.desc)).forEach(b => { S.bills.push({id: uid(), month: cur, desc: b.desc, valor: b.valor, paid: false}); c++; });
      persist(); render(); toast(c ? `${c} fatura(s) copiada(s). Ajuste os valores.` : 'Nada novo para copiar.'); break; }
    case 'add-purchase': formPurchase(); break;
    case 'edit-purchase': formPurchase(find(S.purchases)); break;
    case 'del-purchase': { const p = find(S.purchases); confirmBox(`Excluir “${p.desc}” de ${p.who}?`, () => S.purchases = S.purchases.filter(x => x.id !== id)); break; }
    case 'recv': formRecv(t.dataset.who); break;
    case 'settle': { const w = t.dataset.who, s = stats(cur), v = s.aberto[w]; if (v > 0.005) { S.received.push({id: uid(), who: w, month: cur, valor: v}); persist(); render(); toast(`${w}: mês quitado.`); } break; }
    case 'del-recv': S.received = S.received.filter(x => x.id !== id); persist(); render(); break;
    case 'add-person': openForm({title:'Nova pessoa', fields:[{name:'name', label:'Nome', type:'text'},{name:'inBill', label:'As compras dela passam pela sua fatura?', type:'select', value:'1', options:[{v:'1', l:'Sim, ela me paga depois'},{v:'0', l:'Não, ela paga por conta própria'}]}],
      validate: v => !v.name ? 'Escreva o nome.' : peopleAll().includes(v.name) ? 'Já existe alguém com esse nome.' : '', onSave: v => S.people.push({name: v.name, inBill: v.inBill === '1'})}); break;
    case 'del-person': { const i = +t.dataset.i, p = S.people[i]; confirmBox(`Remover ${p.name}? Os itens dela continuam cadastrados.`, () => S.people.splice(i, 1), 'Remover'); break; }
    case 'up-person': case 'down-person': { const i = +t.dataset.i, j = a === 'up-person' ? i - 1 : i + 1; if (j >= 0 && j < S.people.length) { [S.people[i], S.people[j]] = [S.people[j], S.people[i]]; persist(); render(); } break; }
    case 'add-months': openForm({title:'Acrescentar meses', fields:[{name:'n', label:'Quantos meses a mais?', type:'int', value:'12'}], validate: v => (!Number.isInteger(v.n) || v.n < 1 || v.n > 120) ? 'Informe de 1 a 120.' : '', onSave: v => { S.count += v.n; toast(`Agora vai até ${ymAdd(S.start, S.count - 1)}.`); }, cta:'Acrescentar'}); break;
    case 'del-month': {
      if (!monthQuitado(cur)) { toast('Só dá para excluir um mês com todas as faturas pagas e nada a receber.'); break; }
      if (ml.length <= 1) { toast('Precisa ficar pelo menos um mês.'); break; }
      confirmBox(`Excluir o mês ${cur} da tela? Ele está quitado.`, () => { S.hidden.push(cur); cur = monthsList()[0]; }); break; }
    case 'restore-month': S.hidden = S.hidden.filter(m => m !== t.dataset.m); persist(); render(); toast('Mês restaurado.'); break;
    case 'add-cat': openForm({title:'Nova categoria', fields:[{name:'name', label:'Nome', type:'text'}], validate: v => !v.name ? 'Escreva o nome.' : S.cats.includes(v.name) ? 'Essa categoria já existe.' : '', onSave: v => S.cats.push(v.name)}); break;
    case 'exp-csv': saveFile('controle-financeiro.csv', csv(), 'Resumo exportado.'); break;
    case 'exp-json': saveFile('controle-financeiro-copia.json', JSON.stringify(S, null, 1), 'Cópia salva.'); break;
    case 'reset': confirmBox('Voltar aos dados iniciais? Tudo o que você alterou será substituído.', () => { S = seed(); cur = S.start; }, 'Voltar aos iniciais'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'msel') { cur = t.value; render(); return; }
  if (t.dataset.act === 'toggle-bill') { const b = S.bills.find(x => x.id === t.dataset.id); if (b) { b.paid = t.checked; persist(); render(); } return; }
  if (t.dataset.set) {
    const k = t.dataset.set;
    if (k === 'titular') { const v = t.value.trim(); if (v) { S.purchases.forEach(p => { if (p.who === S.titular) p.who = v; }); S.titular = v; } }
    else if (k === 'start') { if (t.value) { S.start = t.value; if (!monthsList().includes(cur)) cur = S.start; } }
    else { const n = Number(t.value.replace(',', '.')); if (n > 0 && n <= 200) S[k] = n / 100; }
    persist(); render(); return;
  }
  if (t.dataset.pname !== undefined) {
    const i = +t.dataset.pname, old = S.people[i].name, v = t.value.trim();
    if (v && !peopleAll().includes(v)) { S.purchases.forEach(p => { if (p.who === old) p.who = v; }); S.received.forEach(r => { if (r.who === old) r.who = v; }); S.people[i].name = v; persist(); }
    render(); return;
  }
  if (t.dataset.pbill !== undefined) { S.people[+t.dataset.pbill].inBill = t.checked; persist(); render(); return; }
  if (t.dataset.cname !== undefined) {
    const i = +t.dataset.cname, old = S.cats[i], v = t.value.trim();
    if (v && !S.cats.includes(v)) { S.purchases.forEach(p => { if (p.cat === old) p.cat = v; }); S.cats[i] = v; persist(); }
    render(); return;
  }
  if (t.id === 'imp' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || !Array.isArray(o.purchases)) throw 0; S = normalize(o); cur = S.start; persist(); render(); toast('Cópia restaurada.'); } catch (x) { toast('Arquivo inválido.'); } };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('g[data-month]')) { e.preventDefault(); cur = e.target.closest('g[data-month]').dataset.month; render(); }
});

initStore();
</script>
